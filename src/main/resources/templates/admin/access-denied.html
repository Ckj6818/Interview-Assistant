<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>无权访问 - 管理后台</title>
    <link rel="stylesheet" th:href="@{/css/modern-theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin-theme.css}">
</head>
<body class="admin-console">
<div class="admin-main" style="margin-left: 0; padding-top: 120px;">
    <div class="admin-card mx-auto" style="max-width: 520px;">
        <div class="p-5 text-center">
            <i class="bi bi-shield-x" style="font-size: 3rem; color: var(--admin-accent);"></i>
            <h3 class="mt-3 mb-2" style="color: var(--admin-text);">需要管理员权限</h3>
            <p style="color: var(--admin-text-muted);">
                当前账号无法访问管理后台，请使用 <strong>admin</strong> 账号登录。
            </p>
            <div class="d-flex gap-2 justify-content-center mt-4">
                <a th:href="@{/}" class="btn admin-btn-outline">返回用户前台</a>
                <a th:href="@{/login}" class="btn admin-btn-primary">重新登录</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
