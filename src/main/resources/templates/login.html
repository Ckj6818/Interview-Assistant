<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - MindSpark 面之光</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/modern-theme.css}">
    <link rel="stylesheet" th:href="@{/css/auth-pages.css}">
</head>
<body class="auth-page auth-login">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="auth-card card p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-robot text-primary fs-1 mb-2"></i>
                        <h2 class="logo-text m-0">MindSpark 面之光</h2>
                        <p class="auth-subtitle mb-0">智能面试辅助与评测平台</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger text-center small py-2">
                        用户名或密码错误。
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success text-center small py-2">
                        您已成功注销。
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success text-center small py-2">
                        注册成功，请登录。
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="auth-label d-block">用户名</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   required autofocus placeholder="请输入用户名">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="auth-label d-block">密码</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   required placeholder="请输入密码">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary py-2 btn-lg">安全登录</button>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <a th:href="@{/register}" class="btn btn-outline-success btn-sm px-4 mb-2">注册新账号</a>
                        <div>
                            <a th:href="@{/register}" class="auth-link small">还没有账号？去注册</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
