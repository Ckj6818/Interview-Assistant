<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - 管理后台'">管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/modern-theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin-theme.css}">
</th:block>

<div th:fragment="sidebar(active)" class="admin-sidebar d-flex flex-column justify-content-between py-4">
    <div>
        <div class="logo-container mb-4 px-3 d-flex align-items-center">
            <div class="logo-icon me-2 d-flex align-items-center justify-content-center rounded-3"
                 style="width: 40px; height: 40px;">
                <i class="bi bi-shield-lock-fill text-dark fs-5"></i>
            </div>
            <div>
                <div class="admin-logo-title">MindSpark</div>
                <div class="admin-logo-sub">管理员控制台</div>
            </div>
        </div>
        <div class="px-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active' : ''"
                       th:href="@{/admin}">
                        <i class="bi bi-speedometer2 me-2"></i> 控制台首页
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'questions'} ? ' active' : ''"
                       th:href="@{/admin/questions}">
                        <i class="bi bi-journal-code me-2"></i> 题库管理
                    </a>
                </li>
            </ul>
            <div class="nav-divider"></div>
            <a class="back-user-link text-decoration-none d-flex align-items-center px-2 py-1"
               th:href="@{/}">
                <i class="bi bi-arrow-left-circle me-2"></i> 返回用户前台
            </a>
        </div>
    </div>
    <div class="px-3">
        <div class="mb-2 px-2" style="color: var(--admin-text-muted); font-size: 0.8rem;">
            <i class="bi bi-person-badge me-1"></i>
            <span th:text="${currentUsername}">admin</span>
        </div>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="nav-link py-2 px-2 text-start w-100"
                    style="border: none; background: transparent; cursor: pointer; color: var(--admin-text-muted);">
                <i class="bi bi-box-arrow-right me-2"></i> 退出登录
            </button>
        </form>
    </div>
</div>

<div th:fragment="topbar(pageTitle)" class="admin-topbar">
    <div class="admin-topbar-badge">
        <i class="bi bi-shield-fill-check"></i>
        ADMIN CONSOLE · 管理员模式
    </div>
    <div style="color: var(--admin-text-muted); font-size: 0.88rem;" th:text="${pageTitle}">页面标题</div>
</div>

<div th:fragment="flash" th:if="${successMessage}" class="admin-alert-success">
    <i class="bi bi-check-circle me-2"></i>
    <span th:text="${successMessage}">操作成功</span>
</div>

</html>
