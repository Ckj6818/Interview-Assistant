<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>出错了</title>
    <link rel="stylesheet" th:href="@{/css/modern-theme.css}">
</head>
<body class="p-5">
<div style="max-width: 720px; margin: 80px auto; color: var(--text-primary);">
    <h2 class="mb-3">页面加载失败</h2>
    <p class="text-muted" th:text="${url}">URL</p>
    <pre style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px; overflow: auto;"
         th:text="${exception != null ? exception.message : '未知错误'}">error</pre>
    <a th:href="@{/}" class="btn btn-primary mt-3 me-2">返回首页</a>
    <a th:href="@{/register}" class="btn btn-success mt-3">去注册</a>
    <a th:href="@{/login}" class="btn btn-outline-secondary mt-3">去登录</a>
</div>
</body>
</html>
