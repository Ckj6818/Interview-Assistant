<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面不存在</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-theme.css}">
</head>
<body class="p-5" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
<div style="max-width: 520px; text-align: center; color: var(--text-primary);">
    <h2 class="mb-3">页面不存在 (404)</h2>
    <p class="text-muted mb-2">请检查地址是否正确，常见入口：</p>
    <ul class="list-unstyled text-muted mb-4" style="line-height: 2;">
        <li><a th:href="@{/login}">登录</a> → <code>/login</code></li>
        <li><a th:href="@{/register}">注册</a> → <code>/register</code></li>
        <li><a th:href="@{/}">首页</a> → <code>/</code></li>
    </ul>
    <p class="text-muted small mb-4" th:if="${url}" th:text="'请求地址：' + ${url}"></p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
        <a th:href="@{/register}" class="btn btn-success">去注册</a>
        <a th:href="@{/login}" class="btn btn-primary">去登录</a>
        <a th:href="@{/}" class="btn btn-outline-secondary">返回首页</a>
    </div>
</div>
</body>
</html>
