<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - MindSpark 面之光</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/modern-theme.css}">
    <link rel="stylesheet" th:href="@{/css/auth-pages.css}">
</head>
<body class="auth-page">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="auth-card card p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus text-success fs-1 mb-2"></i>
                        <h2 class="logo-text m-0">注册新账号</h2>
                        <p class="auth-subtitle mb-0">加入 MindSpark 面之光，开启求职助力</p>
                    </div>

                    <div th:if="${errorMsg}" class="alert alert-danger text-center small py-2" th:text="${errorMsg}">
                        错误信息
                    </div>

                    <form th:action="@{/register}" method="post" id="registerForm">
                        <div class="mb-3">
                            <label for="username" class="auth-label d-block">用户名</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   th:value="${username}" required autofocus
                                   minlength="3" maxlength="20"
                                   placeholder="3～20 位，支持中文/字母/数字/下划线">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="auth-label d-block">密码</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   required minlength="6" placeholder="至少 6 位">
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="auth-label d-block">确认密码</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                   required minlength="6" placeholder="再次输入密码">
                        </div>
                        <ul class="rule-list mb-4">
                            <li>注册后默认为普通用户，可刷题、模拟面试</li>
                            <li>管理员账号不可通过注册获得</li>
                        </ul>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success py-2 btn-lg">创建账号</button>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <a th:href="@{/login}" class="auth-link small">已有账号？返回登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        const pwd = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (pwd !== confirm) {
            e.preventDefault();
            alert('两次输入的密码不一致');
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
