server:
  port: 8081

spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    # MySQL 连接配置。账号密码请在 application-local.yml 中覆盖（勿提交到 Git）
    url: jdbc:mysql://localhost:3306/interviewai?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: your_mysql_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jpa:
    # 实体类自动映射建表策略：update (开发环境下自动更新表结构)
    hibernate:
      ddl-auto: update
    # 显示底层执行的 SQL 语句
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Thymeleaf 配置（禁用缓存，方便开发调试时实时看到前端修改）
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  # 初始化 SQL 数据脚本（仅首次由 DataInitializer 执行，避免每次启动重复插入）
  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 自定义配置（LLM 大模型 API）
interviewai:
  llm:
    # 是否启用真实 API 调用（为 false 时走本地关键字匹配逻辑，防报错）
    enable-real-api: true
    # 您的 OpenAI/DeepSeek 兼容 API URL
    api-url: https://api.deepseek.com/v1/chat/completions
    # API Key 请在 application-local.yml 或环境变量 DEEPSEEK_API_KEY 中配置
    api-key: ${DEEPSEEK_API_KEY:YOUR_DEEPSEEK_API_KEY_HERE}
    # 模型名称
    model: deepseek-chat
